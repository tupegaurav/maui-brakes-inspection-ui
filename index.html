<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mauli Inspection Terminal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hazard-bar" aria-hidden="true"></div>

  <header class="page-header">
    <p class="eyebrow">MAULI AUTOMATION · POC</p>
    <h1>Inspection Terminal</h1>
    <p class="subhead">Log a check. The line validates the count and flags anything off before it hits the record.</p>
  </header>

  <main>
    <form id="inspection-form" class="panel" autocomplete="off">
      <label class="field">
        <span class="field-label">PART NAME</span>
        <input id="partName" list="known-parts" required placeholder="Start typing or pick from the list" />
        <datalist id="known-parts">
          <option value="TVS FRONT CALIPER"></option>
          <option value="K-17 FRONT CALIPER"></option>
          <option value="REJ-C MASTER CYL"></option>
          <option value="ACPD CALIPER"></option>
          <option value="HERO ADHG CALIPER"></option>
          <option value="HONDA UNICORN CALIPER"></option>
          <option value="CANISTER K10"></option>
          <option value="N-TOEQ MASTER CYL"></option>
          <option value="TVS FRONT MASTER CYLINDER"></option>
          <option value="HERO ABSR MASTER CYL"></option>
          <option value="ADJR MASTER CYLINDER"></option>
          <option value="ADHG MASTER CYLINDER"></option>
          <option value="HONDA UNICORN MASTER CYLINDER"></option>
          <option value="H105 M/CYL"></option>
          <option value="PULSER HOLDER BRACKET"></option>
        </datalist>
      </label>

      <div class="qty-grid">
        <label class="field qty-field">
          <span class="field-label">CHECK QTY</span>
          <input id="checkQty" type="number" inputmode="numeric" min="0" value="0" required />
        </label>
        <label class="field qty-field qty-ok">
          <span class="field-label">OK QTY</span>
          <input id="okQty" type="number" inputmode="numeric" min="0" value="0" required />
        </label>
        <label class="field qty-field qty-reject">
          <span class="field-label">REJ QTY</span>
          <input id="rejQty" type="number" inputmode="numeric" min="0" value="0" required />
        </label>
        <label class="field qty-field qty-warn">
          <span class="field-label">REWORK QTY</span>
          <input id="reworkQty" type="number" inputmode="numeric" min="0" value="0" required />
        </label>
      </div>

      <div class="two-col">
        <label class="field">
          <span class="field-label">INSPECTOR ID</span>
          <input id="inspectorId" required placeholder="INS-001" class="mono-input" />
        </label>
        <label class="field">
          <span class="field-label">SHIFT</span>
          <select id="shift">
            <option>Morning</option>
            <option>Evening</option>
            <option>Night</option>
          </select>
        </label>
      </div>

      <button type="submit" id="submit-btn">Log Entry</button>
    </form>

    <section class="result-section">
      <div class="andon" id="andon">
        <div class="lights">
          <span class="light light-critical" id="light-critical"></span>
          <span class="light light-warning" id="light-warning"></span>
          <span class="light light-normal" id="light-normal"></span>
        </div>
        <div class="andon-label">
          <div class="andon-title">SIGNAL</div>
          <div class="andon-status" id="andon-status">STANDBY</div>
        </div>
      </div>

      <div id="network-error" class="banner banner-error" hidden></div>

      <div id="result-panel" class="panel result-panel" hidden>
        <p id="result-message"></p>
        <ul id="result-errors" class="errors-list"></ul>
        <button id="reset-btn" type="button">LOG NEXT ENTRY</button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
